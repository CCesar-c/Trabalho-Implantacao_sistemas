<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css" rel="stylesheet" />
  <title>Reforço Escolar</title>
</head>

<body>
  <main class="login">
    <section class="folha">
      <h1>Reforço <span>Escolar</span></h1>
      <p>Digite seu nome para ver suas aulas.</p>
      <div class="campo">
        <label for="nome">Nome do aluno</label>
        <input id="nome" placeholder="Ex.: Maria Silva" autocomplete="name" />
      </div>
      <button class="btn" onclick="logar()">Entrar</button>
    </section>
  </main>

  <script>
    document.getElementById("nome").addEventListener("keydown", (e) => {
      if (e.key === "Enter") logar();
    });

    async function logar() {
      const nome = document.getElementById("nome").value.trim();
      if (!nome) return alert("Digite o nome do aluno");

      const res = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ nome })
      });
      const resposta = await res.json();

      if (resposta != null) {
        localStorage.setItem("nome", nome);   // salva antes de trocar de página
        window.location.href = "dashboard.html";
      } else {
        alert("Nome não encontrado");
      }
    }
  </script>
</body>

</html>
