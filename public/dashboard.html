<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css" rel="stylesheet" />
  <title>Painel do aluno</title>
</head>

<body>
  <header class="topo">
    <strong>Reforço Escolar</strong>
    <button class="btn btn--ghost" onclick="sair()">Sair</button>
  </header>

  <main class="pagina">
    <section class="perfil" id="perfil"></section>

    <section class="secao">
      <h2>Aulas</h2>
      <div class="grade" id="aulas"></div>
    </section>

    <section class="secao">
      <h2>Especialistas</h2>
      <div class="grade" id="especialista"></div>
    </section>
  </main>

  <script>
    const API = "http://localhost:3000";
    const nome = localStorage.getItem("nome");
    if (!nome) window.location.href = "index.html";

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function sair() {
      localStorage.removeItem("nome");
      window.location.href = "index.html";
    }

    const vazio = (txt) => `<p class="vazio">${txt}</p>`;

    async function carregar() {
      const [aluno, aulas, especialistas] = await Promise.all([
        fetch(`${API}/aluno/${encodeURIComponent(nome)}`).then(r => r.json()),
        fetch(`${API}/aulas`).then(r => r.json()),
        fetch(`${API}/especialista`).then(r => r.json())
      ]);

      const a = aluno?.[0];
      document.getElementById("perfil").innerHTML = a
        ? `<h1>Olá, <span>${esc(a.nome_aluno)}</span></h1>
           <div class="fichas">
             <span class="ficha">${esc(a.ano_aluno)}º ano</span>
             <span class="ficha ficha--alerta">Precisa de reforço em ${esc(a.materia_dificuldade)}</span>
           </div>`
        : vazio("Não encontramos os dados do aluno.");

      document.getElementById("aulas").innerHTML = aulas?.length
        ? aulas.map(x => `
            <article class="cartao cartao--aula">
              <h3>${esc(x.materia)}</h3>
              <div class="meta">
                <span>Começa: ${esc(x.comeca)}</span>
                <span>Série: ${esc(x.serie)}</span>
              </div>
            </article>`).join("")
        : vazio("Nenhuma aula disponível por enquanto.");

      document.getElementById("especialista").innerHTML = especialistas?.length
        ? especialistas.map(x => `
            <article class="cartao cartao--esp">
              <h3>${esc(x.nome)}</h3>
              <p>${esc(x.descricao)}</p>
              <div class="meta"><span>${esc(x.materias)}</span></div>
            </article>`).join("")
        : vazio("Nenhum especialista cadastrado.");
    }

    carregar().catch(() => {
      document.getElementById("perfil").innerHTML =
        vazio("Não foi possível carregar os dados. O servidor está rodando?");
    });
  </script>
</body>

</html>
